name: WSTB Song Watcher

on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 minutes (UTC; GitHub timing is best-effort)
  workflow_dispatch:            # lets you run it manually from the Actions tab
    inputs:
      test:
        description: "Send a test notification instead of a real check"
        type: boolean
        default: false

permissions:
  contents: write               # needed to commit state/last_seen.txt back

concurrency:
  group: wstb-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check WSTB recently-played
        env:
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL:       ${{ secrets.NOTIFY_EMAIL }}
          NTFY_TOPIC:         ${{ secrets.NTFY_TOPIC }}
          TEST_RUN:           ${{ inputs.test }}
        run: python check_song.py

      - name: Persist state if it changed
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "update last_seen"
            git push
          else
            echo "No state change."
          fi
